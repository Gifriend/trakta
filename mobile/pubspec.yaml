name: trakta_mobile
description: Trakta attendance for Android and iOS
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^3.0.0
  go_router: ^16.3.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  camera: ^0.11.2
  image_picker: ^1.2.1
  geolocator: ^14.0.2
  image: ^4.8.0
  shared_preferences: ^2.5.4
  share_plus: ^10.1.4
  cross_file: ^0.3.4+2
  archive: ^4.0.7
  intl: ^0.20.2
  cupertino_native: ^0.1.1
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.0.6
  build_runner: ^2.5.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand.svg
    - assets/translations.json

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
